name: Publish to GitHub Packages

# ignore tags as the untagged commit has the same GITHUB_SHA and would conflict
on:
  workflow_dispatch:
jobs:
  publish:
    if: github.repository_owner == 'IntelliMapLab'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
      - name: Cache Maven artifacts
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Cache node
        uses: actions/cache@v5
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os}}-node-
      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os}}-node_modules-
      - name: Build and publish package ${{ matrix.java-version }}
        # special 'wagon' option due to https://github.com/orgs/community/discussions/49001
        run: |
          mvn -B versions:set -DnewVersion=$GITHUB_SHA -DgenerateBackupPoms=false -s ci_settings.xml
          mvn -B -DskipTests -Pskip-shaded-web-jar -Pskip-tools-jar source:jar deploy -s ci_settings.xml
        env:
          GITLAB_MAVEN_READ_TOKEN: ${{ secrets.GITLAB_MAVEN_READ_TOKEN }}
          GITLAB_MAVEN_WRITE_TOKEN: ${{ secrets.GITLAB_MAVEN_WRITE_TOKEN }}
